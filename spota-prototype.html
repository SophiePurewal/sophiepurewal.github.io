<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spota interactive concept</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9edf0;color:#111b24;font:15px/1.45 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #175fdd;outline-offset:3px}.phone{max-width:430px;min-height:750px;margin:0 auto;background:#fbfbf9;box-shadow:0 12px 50px #15202a24;position:relative;overflow:hidden}.top{background:#14222b;color:white;padding:20px 22px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;letter-spacing:-1.4px}.tag{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.content{padding:20px 20px 96px;min-height:640px}.muted{color:#485663}.hint{font-size:12px;color:#52606c}.button{border:0;border-radius:12px;background:#b9f44d;color:#101c22;padding:13px 17px;min-height:44px;font-weight:800}.button.secondary{background:#e5ecec}.button.dark{background:#15242d;color:#fff}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.stack{display:grid;gap:12px}.card{background:#fff;border:1px solid #ccd5d8;border-radius:16px;padding:15px;box-shadow:0 3px 10px #18232b0a}.card h3{margin:0 0 6px;font-size:17px}.pill{display:inline-flex;align-items:center;border-radius:50px;background:#e9f0f0;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap}.pill.good{background:#dff5c0}.pill.warn{background:#fff0c4}.pill.risk{background:#ffe0d8}h1{font-size:30px;letter-spacing:-1px;line-height:1.12;margin:0 0 10px}h2{font-size:20px;letter-spacing:-.5px;margin:0 0 12px}p{margin:6px 0 15px}.tabs{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #cbd4d7;padding:9px 3px 12px;z-index:5}.tabs button{border:0;background:transparent;color:#455460;font-size:11px;min-height:46px;display:grid;place-items:center;gap:2px}.tabs button[aria-current=page]{color:#0d2731;font-weight:900}.tabs span{font-size:19px}.map{height:245px;position:relative;border-radius:17px;overflow:hidden;background:#dce8e4;background-image:linear-gradient(26deg,transparent 44%,#f8f8f2 45%,#f8f8f2 49%,transparent 50%),linear-gradient(120deg,transparent 40%,#fff 41%,#fff 46%,transparent 47%),linear-gradient(0deg,transparent 45%,#b4d4ca 46%,#b4d4ca 55%,transparent 56%);border:1px solid #c5d1cd}.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 45px,#ffffff85 46px 53px,transparent 54px 85px);transform:rotate(-18deg)}.pin{position:absolute;z-index:1;border:2px solid white;border-radius:50%;background:#15252e;color:#fff;width:42px;height:42px;box-shadow:0 3px 8px #0003;font-weight:900}.pin:nth-child(1){top:28%;left:22%}.pin:nth-child(2){top:52%;left:63%}.pin:nth-child(3){top:15%;left:72%}.search,select,textarea,input[type=text]{width:100%;border:1px solid #aab8bd;border-radius:10px;padding:12px;background:#fff;color:#14232b;min-height:44px}.chips{display:flex;gap:7px;overflow:auto;padding:12px 0}.chip{border:1px solid #a8b7b8;background:#fff;padding:8px 12px;border-radius:20px;white-space:nowrap;min-height:40px;font-weight:700;font-size:12px}.chip[aria-pressed=true]{background:#14252c;color:#fff}.spot{width:100%;text-align:left;background:#fff;border:1px solid #cbd4d7;border-radius:14px;padding:14px;margin:8px 0}.spot strong{font-size:16px}.photo{height:155px;background:linear-gradient(130deg,#83918c,#d3d6cd 55%,#566a66);border-radius:13px;position:relative;overflow:hidden;margin-bottom:15px}.photo:after{content:"";position:absolute;bottom:28px;left:-20px;right:-20px;height:12px;background:#a8b2ad;transform:rotate(-7deg);box-shadow:0 18px 0 #626c69}.field{display:grid;gap:5px;font-weight:700;font-size:13px;margin-bottom:15px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metrics div{padding:10px;background:#eff2f0;border-radius:10px}.metrics strong{display:block}.intro{min-height:610px;display:flex;flex-direction:column;justify-content:center}.intro .hero{font-size:80px;margin-bottom:15px}.notice{padding:11px;background:#e5f6cb;border-radius:10px;margin:12px 0}.hide{display:none!important}.section{margin-top:24px}.counter{font-size:36px;font-weight:900}.review{border-left:3px solid #b9f44d;padding-left:12px}.step{color:#43535b;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
</style></head><body><div class="phone"><header class="top"><div class="brand">spota<span style="color:#b9f44d">.</span></div><span class="tag">Find your line ↗</span></header><div id="screen" class="content" aria-live="polite"></div><nav id="tabs" class="tabs" aria-label="App navigation"></nav></div><script>
const spots=[{id:1,name:"Northern Quarter Flatground",city:"Manchester",type:"Flatground",level:"Beginner",rating:4.8,crowd:"Low",surface:"Smooth",safety:"Good",distance:"0.8 mi",tip:"Quiet before 11am. Smooth paving, ideal for practising ollies.",updated:"2 days ago",features:"Flatground, manual practice",lighting:"Daylight",security:"Low risk",transport:"Tram and walking",review:"Finally somewhere I can practise without feeling watched. — Maya"},{id:2,name:"Bristol Ledge Spot",city:"Bristol",type:"Ledge",level:"Intermediate",rating:4.6,crowd:"Medium",surface:"Good",safety:"Moderate",distance:"1.3 mi",tip:"Good waxed ledges. Respect pedestrians and keep the area tidy.",updated:"Yesterday",features:"Ledges, street lines",lighting:"Street lighting",security:"Occasional checks",transport:"Cycle or bus",review:"Great ledges; a little busy after work. — Jay"},{id:3,name:"Southbank Practice Zone",city:"London",type:"Street spot",level:"Beginner",rating:4.7,crowd:"High",surface:"Smooth",safety:"Good",distance:"2.1 mi",tip:"Go early on weekends to avoid the busiest sessions.",updated:"4 days ago",features:"Open flatground, banks",lighting:"Good lighting",security:"Low risk",transport:"Waterloo station",review:"The early sessions are much less intimidating. — Sam"},{id:4,name:"Castlefield Banks",city:"Manchester",type:"Street spot",level:"Advanced",rating:4.4,crowd:"Low",surface:"Variable",safety:"Moderate",distance:"2.6 mi",tip:"Check ground conditions after rain.",updated:"1 week ago",features:"Banks, gaps",lighting:"Limited",security:"Be considerate",transport:"Train and walking",review:"A proper challenge, but check the ground first. — Local skater"}];
let page="welcome",selected=1,level="All",type="All",query="",beginner=false,saved=new Set(),step=1,updates=["Jay updated surface quality at Bristol Ledge Spot","Maya rated Northern Quarter Flatground beginner-friendly","Sam saved Southbank Practice Zone"],contributions=0,reviewCount=0,photo=0;
const el=document.getElementById("screen"),tabs=document.getElementById("tabs");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function go(p,id){page=p;if(id)selected=id;render();el.scrollTop=0;window.scrollTo({top:0,behavior:"smooth"})}
function badge(s){return '<span class="pill '+(s==="Beginner"?"good":s==="Advanced"?"risk":"warn")+'">'+esc(s)+'</span>'}
function spotCard(s){return '<button class="spot" onclick="go(\'detail\','+s.id+')"><span class="row between"><strong>'+esc(s.name)+'</strong>'+badge(s.level)+'</span><span class="hint">'+esc(s.city)+' · '+esc(s.type)+' · '+esc(s.distance)+'</span><div class="row" style="margin-top:9px;flex-wrap:wrap"><span class="pill">★ '+s.rating+'</span><span class="pill">'+esc(s.crowd)+' crowd</span><span class="pill">'+esc(s.surface)+' ground</span></div></button>'}
function nav(){tabs.innerHTML=page==="welcome"?"":[["map","⌖","Explore"],["saved","♡","Saved"],["add","＋","Add"],["community","◉","Updates"],["profile","♙","Profile"]].map(([id,ic,label])=>'<button aria-current="'+(page===id?"page":"false")+'" onclick="go(\''+id+'\')"><span aria-hidden="true">'+ic+'</span>'+label+'</button>').join("")}
function render(){nav();if(page==="welcome"){el.innerHTML='<div class="intro"><div class="hero" aria-hidden="true">🛹</div><span class="tag">Made for the session</span><h1>More skating.<br>Less searching.</h1><p>Find skateable spots near you. Check the level, surface, crowd, and local tips before you go.</p><button class="button" onclick="go(\'map\')">Start Exploring →</button><p class="hint section">Interactive portfolio concept · Sample community data</p></div>';return}
if(page==="map"){let found=spots.filter(s=>(level==="All"||s.level===level)&& (type==="All"||s.type===type)&&(!beginner||s.level==="Beginner")&&(s.name+" "+s.city).toLowerCase().includes(query.toLowerCase()));el.innerHTML='<div class="row between"><div><span class="tag">Explore nearby</span><h1>Find your spot.</h1></div><button class="button secondary" onclick="nearMe()">⌖ Near me</button></div><label class="field"><span class="hide">Search spots</span><input class="search" id="search" placeholder="Search spot or city…" value="'+esc(query)+'" oninput="query=this.value;updateResults()"></label><div class="chips" aria-label="Difficulty filters">'+["All","Beginner","Intermediate","Advanced"].map(v=>'<button class="chip" aria-pressed="'+(level===v)+'" onclick="level=\''+v+'\';render()">'+v+'</button>').join("")+'</div><div class="row" style="gap:8px"><label style="flex:1"><span class="hint">Spot type</span><select onchange="type=this.value;render()">'+["All","Skatepark","Street spot","Ledge","Flatground","Stairs","Bowl","Manual pad","Rail"].map(v=>'<option '+(v===type?"selected":"")+'>'+v+'</option>').join("")+'</select></label><button class="chip" style="align-self:end" aria-pressed="'+beginner+'" onclick="beginner=!beginner;render()">✓ Beginner mode</button></div><div class="map section" role="group" aria-label="Illustrative map; choose a pin to view a spot">'+spots.slice(0,3).map(s=>'<button class="pin" aria-label="View '+esc(s.name)+'" onclick="go(\'detail\','+s.id+')">🛹</button>').join("")+'</div><p class="hint">Illustrative map · Pins are sample locations, not verified coordinates.</p><div class="row between section"><h2>Recommended spots</h2><span class="hint" id="count">'+found.length+' spots</span></div><div id="results">'+(found.map(spotCard).join("")||'<div class="card">No spots match these filters. Try a different level or add one for your community.</div>')+'</div>';return}
if(page==="detail"){let s=spots.find(x=>x.id===selected);el.innerHTML='<button class="chip" onclick="go(\'map\')">← Back to map</button><div class="photo section" role="img" aria-label="Illustrative skate spot artwork"></div><div class="row between"><h1>'+esc(s.name)+'</h1>'+badge(s.level)+'</div><p class="muted">'+esc(s.city)+' · '+esc(s.distance)+' · ★ '+s.rating+' · Updated '+esc(s.updated)+'</p><div class="metrics"><div><span class="hint">Crowd</span><strong>'+esc(s.crowd)+'</strong></div><div><span class="hint">Surface</span><strong>'+esc(s.surface)+'</strong></div><div><span class="hint">Safety</span><strong>'+esc(s.safety)+'</strong></div><div><span class="hint">Lighting</span><strong>'+esc(s.lighting)+'</strong></div></div><div class="actions"><button class="button" onclick="toggleSave('+s.id+')">'+(saved.has(s.id)?"♥ Saved":"♡ Save spot")+'</button><button class="button secondary" onclick="alert(\'Directions are not connected in this concept prototype.\')">↗ Directions</button></div><section class="section"><h2>Best for</h2><p>'+esc(s.level)+' skating · '+esc(s.features)+'</p><h2>Local tips</h2><p>'+esc(s.tip)+'</p><h2>Before you go</h2><p><strong>Security:</strong> '+esc(s.security)+'<br><strong>Transport:</strong> '+esc(s.transport)+'</p><h2>Community review</h2><p class="review">'+esc(s.review)+'</p><div class="actions"><button class="button secondary" onclick="addReview()">＋ Add review</button><button class="button secondary" onclick="report()">↻ Update spot</button></div></section>';return}
if(page==="saved"){let list=spots.filter(s=>saved.has(s.id));el.innerHTML='<span class="tag">Your collection</span><h1>Saved spots.</h1><p>Keep your next session ready.</p>'+(list.map(spotCard).join("")||'<div class="card"><h3>No saved spots yet</h3><p>Save a spot from Explore to build your skate list.</p><button class="button" onclick="go(\'map\')">Explore spots</button></div>');return}
if(page==="community"){el.innerHTML='<span class="tag">Skaters helping skaters</span><h1>Community.</h1><div class="notice">✦ Helpful updates keep spot information fresh.</div>'+updates.map((u,i)=>'<div class="card section"><span class="pill good">Community update</span><p>'+esc(u)+'</p><span class="hint">'+(i===0?"Recently":"This week")+'</span></div>').join("")+'<p class="hint section">Sample activity and local contributions in this concept prototype.</p>';return}
if(page==="profile"){el.innerHTML='<span class="tag">Your profile</span><h1>Hey, skater.</h1><div class="card"><div style="font-size:45px">🛹</div><h2>Spota Explorer</h2><p class="muted">Beginner / Intermediate · UK</p><div class="metrics"><div><span class="counter">'+saved.size+'</span><span class="hint">Saved spots</span></div><div><span class="counter">'+reviewCount+'</span><span class="hint">Reviews</span></div><div><span class="counter">'+contributions+'</span><span class="hint">Contributions</span></div><div><span class="counter">'+(contributions*10+reviewCount*5)+'</span><span class="hint">Helpful points</span></div></div></div><div class="section notice">🏅 Share helpful local updates to build your community reputation.</div>';return}
if(page==="add"){const fields=[['Location','Where is the spot?','text'],['Spot details','Name and spot type','details'],['Conditions','Difficulty and ground quality','conditions'],['Local knowledge','Safety notes and tips','notes']];el.innerHTML='<span class="tag">Give back to the scene</span><h1>Add a spot.</h1><p class="step">Step '+step+' of 4 · '+fields[step-1][0]+'</p><div class="card"><h2>'+fields[step-1][1]+'</h2><form id="spotForm" onsubmit="nextStep(event)">'+(step===1?'<label class="field">Spot name<input required name="name" type="text" placeholder="e.g. Riverside flatground"></label><label class="field">City or area<input required name="city" type="text" placeholder="e.g. Manchester"></label>':step===2?'<label class="field">Spot type<select name="type">'+["Skatepark","Street spot","Ledge","Flatground","Stairs","Bowl","Manual pad","Rail"].map(x=>'<option>'+x+'</option>').join("")+'</select></label><label class="field">Photos (optional)<input type="file" accept="image/*" multiple onchange="photo=this.files.length"></label><p class="hint">Photos stay on your device in this demo.</p>':step===3?'<label class="field">Difficulty<select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><label class="field">Surface quality<select name="surface"><option>Smooth</option><option>Good</option><option>Variable</option><option>Rough</option></select></label>':'<label class="field">Safety / security notes<textarea name="safety" rows="3" required placeholder="Access, security, traffic, lighting…"></textarea></label><label class="field">Local tips<textarea name="tip" rows="3" required placeholder="Best times, crowds, tricks…"></textarea></label>')+'<div class="actions">'+(step>1?'<button class="button secondary" type="button" onclick="step--;render()">← Back</button>':'')+'<button class="button" type="submit">'+(step===4?"Submit spot":"Continue →")+'</button></div></form></div><p class="hint section">Concept demo: submissions are local to this preview and are not published.</p>';return}}
function updateResults(){let found=spots.filter(s=>(level==="All"||s.level===level)&&(type==="All"||s.type===type)&&(!beginner||s.level==="Beginner")&&(s.name+" "+s.city).toLowerCase().includes(query.toLowerCase()));document.getElementById("results").innerHTML=found.map(spotCard).join("")||'<div class="card">No beginner-friendly spots nearby yet — add one for your community.</div>';document.getElementById("count").textContent=found.length+" spots"}
function nearMe(){alert("Location access is not used in this concept. Browse sample spots in Manchester, Bristol and London.");}
function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);render()}
function addReview(){let v=prompt("Share a practical tip for other skaters:");if(v&&v.trim()){reviewCount++;updates.unshift("You reviewed "+spots.find(s=>s.id===selected).name+": "+v.trim().slice(0,120));alert("Review added to this demo's community updates.");render()}}
function report(){let v=prompt("What has changed at this spot?");if(v&&v.trim()){contributions++;updates.unshift("You updated "+spots.find(s=>s.id===selected).name+": "+v.trim().slice(0,120));alert("Thanks for helping the community!");render()}}
let draft={};function nextStep(e){e.preventDefault();let form=new FormData(e.target);for(let [k,v] of form.entries())if(typeof v==="string")draft[k]=v;if(step<4){step++;render();return}contributions++;updates.unshift("You added "+(draft.name||"a new spot")+" in "+(draft.city||"the UK"));spots.unshift({id:Date.now(),name:draft.name||"Community spot",city:draft.city||"UK",type:draft.type||"Flatground",level:draft.level||"Beginner",rating:"New",crowd:"Unknown",surface:draft.surface||"Unknown",safety:"Check locally",distance:"—",tip:draft.tip||"Newly added",updated:"Just now",features:draft.type||"Skate spot",lighting:"Unknown",security:draft.safety||"Check locally",transport:"Check route",review:"Be the first to review"});step=1;draft={};level="All";type="All";beginner=false;query="";go("map");alert("Your spot is now visible in this demo. It has not been published online.")}
render();
</script></body></html>
