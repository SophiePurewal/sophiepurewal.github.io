<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Datemate mobile QA</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #dfe4d8;
        font: 14px system-ui;
        color: #294538;
      }
      header {
        display: flex;
        gap: 18px;
        align-items: center;
        margin-bottom: 15px;
      }
      select {
        font: inherit;
        padding: 8px;
      }
      iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 1px solid #9cab92;
        background: white;
        box-shadow: 0 10px 50px #30483520;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Datemate · responsive test frame</strong
      ><label
        >Width
        <select
          aria-label="Test viewport width"
          onchange="
            document.querySelector('iframe').style.width = this.value + 'px'
          "
        >
          <option>320</option>
          <option>360</option>
          <option selected>390</option>
          <option>430</option>
          <option>768</option>
        </select></label
      >
    </header>
    <iframe title="Mobile Datemate preview" src="/index.html#/dates"></iframe>
  </body>
</html>
