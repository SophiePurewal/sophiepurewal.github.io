  <script>
    const siteHeader = document.querySelector('.site-header'); const menuToggle = document.querySelector('.menu-toggle'); const dropdownMenu = document.querySelector('#dropdown-menu'); const themeToggle = document.querySelector('.theme-toggle'); const key = 'sophie-theme';
    const sync = () => siteHeader && dropdownMenu && siteHeader.classList.toggle('menu-open', dropdownMenu.classList.contains('open'));
    const closeMenu = () => { if (!dropdownMenu || !menuToggle) return; dropdownMenu.classList.remove('open'); menuToggle.setAttribute('aria-expanded', 'false'); sync(); };
    const toggleHeader = () => { if (!siteHeader) return; siteHeader.classList.toggle('scrolled', window.scrollY > 24); sync(); };
    const setToggle = dark => { if (!themeToggle) return; themeToggle.setAttribute('aria-pressed', String(dark)); themeToggle.setAttribute('aria-label', dark ? 'Deactivate dark mode' : 'Activate dark mode'); themeToggle.title = dark ? 'Deactivate dark mode' : 'Activate dark mode'; };
    const applyTheme = mode => { const dark = mode === 'dark'; document.body.classList.toggle('dark-mode', dark); setToggle(dark); };
    applyTheme(localStorage.getItem(key) === 'dark' ? 'dark' : 'light');
    themeToggle?.addEventListener('click', () => { const next = document.body.classList.contains('dark-mode') ? 'light' : 'dark'; applyTheme(next); localStorage.setItem(key, next); });
    menuToggle?.addEventListener('click', () => { const open = dropdownMenu.classList.toggle('open'); menuToggle.setAttribute('aria-expanded', String(open)); sync(); });
    dropdownMenu?.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
    window.addEventListener('scroll', toggleHeader, { passive: true }); toggleHeader();
