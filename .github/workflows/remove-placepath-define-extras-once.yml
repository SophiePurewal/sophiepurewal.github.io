name: Remove PlacePath define extras now
on: push
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message == 'Remove PlacePath define extras now'
    steps:
      - uses: actions/checkout@v4
      - name: Remove exact redundant blocks only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/placepath-case-study.html')
          s=p.read_text()
          start=s.index('          <div class="placepath-priority-grid">')
          next_section=s.index('        <section class="case-study-section" aria-labelledby="evolution-title">', start)
          closing=s.rfind('        </section>', start, next_section)
          if closing == -1:
              raise SystemExit('Define section closing tag not found')
          s=s[:start] + s[closing:]
          p.write_text(s)
          PY
          rm .github/workflows/remove-placepath-define-extras-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/placepath-case-study.html .github/workflows/remove-placepath-define-extras-once.yml
          git commit -m "Remove redundant PlacePath define content"
          git push