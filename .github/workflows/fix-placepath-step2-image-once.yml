name: Fix PlacePath step 2 image
on: push
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Fix PlacePath step 2 image'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use verified low fidelity image in Step 2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/site-header-base.js')
          s=p.read_text()
          old='<img src="${assetBase}placepath-low-fidelity-plan-placement.webp" alt="PlacePath low-fidelity placement planning wireframe" loading="lazy" decoding="async">'
          new='<img src="../assets/case-studies/placepath/low-fi-01-verified-3fb9263f.png" alt="Annotated low-fidelity placement-planning wireframe showing navigation, information hierarchy and screen behaviour" loading="lazy" decoding="async">'
          if old not in s: raise SystemExit('Step 2 image reference not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/fix-placepath-step2-image-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/site-header-base.js .github/workflows/fix-placepath-step2-image-once.yml
          git commit -m "Show verified low fidelity image in PlacePath step 2"
          git push