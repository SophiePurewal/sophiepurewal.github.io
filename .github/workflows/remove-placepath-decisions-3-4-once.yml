name: Remove PlacePath decisions 3 and 4
on: push
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Remove PlacePath decisions 3 and 4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only third and fourth decision sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/placepath-case-study.html')
          s=p.read_text()
          start=s.index('        <section class="case-study-section" aria-labelledby="workflow-title">')
          end=s.index('        <section class="case-study-section placepath-reflection" aria-labelledby="delivery-title">', start)
          removed=s[start:end]
          if 'workflow-title' not in removed or 'records-title' not in removed:
              raise SystemExit('Expected third/fourth decision sections not found')
          s=s[:start]+s[end:]
          p.write_text(s)
          PY
          rm .github/workflows/remove-placepath-decisions-3-4-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/placepath-case-study.html .github/workflows/remove-placepath-decisions-3-4-once.yml
          git commit -m "Remove third and fourth PlacePath decision sections"
          git push