name: Update CV download link

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-cv-download-link.yml

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Point CV download to the latest file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('request-cv.html')
          old_name = 'Sophie_Purewal_Product_Design_CV_2026.pdf'
          new_name = 'Sophie_Purewal_CV_2026_Product_Designer.pdf'

          content = page.read_text(encoding='utf-8')
          occurrences = content.count(old_name)
          if occurrences != 2:
              raise SystemExit(f'Expected 2 old CV filename references, found {occurrences}.')

          if not Path(new_name).is_file():
              raise SystemExit(f'New CV file not found: {new_name}')

          page.write_text(content.replace(old_name, new_name), encoding='utf-8')
          PY

      - name: Commit website update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add request-cv.html
          git commit -m "Point CV download to latest Product Designer CV"
          git push
