name: Restore PlacePath case study once
on: push
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message == 'Run PlacePath case study restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full case study and retain supplied hero
        run: |
          git show 9918ba999567438d2b6fba9af78ac83b82649173:work/placepath-case-study.html > /tmp/placepath.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/placepath.html')
          s=p.read_text()
          s=s.replace('../assets/case-studies/placepath/placepath-dashboard-desktop.webp','../Placepath_Desktop.png',1)
          s=s.replace('max-width: 1100px !important;\n      margin: clamp(28px, 4vw, 48px) auto 0 !important;', 'max-width: 1100px !important;\n      margin: clamp(32px, 4vw, 52px) auto 0 !important;',1)
          p.write_text(s)
          PY
          cp /tmp/placepath.html work/placepath-case-study.html
          rm .github/workflows/restore-placepath-case-study-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/placepath-case-study.html .github/workflows/restore-placepath-case-study-once.yml
          git commit -m "Restore full PlacePath case study with supplied hero"
          git push