name: PlacePath flush viewport frames once
on:
  push:
    paths:
      - '.github/workflows/placepath-flush-viewport-frames-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove outcome viewport padding
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('work/placepath-case-study.html')
          s=p.read_text()
          marker='\n</style>'
          css='''

    /* Outcome viewport images sit flush to their individual frames */
    .placepath-outcome-device-pair__item,
    .placepath-outcome-showcase .placepath-outcome-device-pair__item {
      padding: 0 !important;
      overflow: hidden !important;
    }
    .placepath-outcome-device-pair__item img,
    .placepath-outcome-showcase .placepath-outcome-device-pair__item img {
      display: block !important;
      width: 100% !important;
      height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 0 !important;
    }
'''
          assert marker in s
          s=s.replace(marker, css+marker, 1)
          p.write_text(s)
          PY
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/placepath-flush-viewport-frames-once.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add work/placepath-case-study.html .github/workflows/placepath-flush-viewport-frames-once.yml
          git commit -m "Remove PlacePath outcome viewport padding"
          git push
