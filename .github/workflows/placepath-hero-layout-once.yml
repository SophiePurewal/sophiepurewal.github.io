name: PlacePath hero layout once
on: push
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Run PlacePath hero layout fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine hero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/placepath-case-study.html')
          s=p.read_text()
          old='''            <figure class="hero-visual placepath-hero-visual placepath-responsive-showcase placepath-desktop-only-hero" aria-label="PlacePath coordinator dashboard desktop view">\n    <img class="placepath-desktop-hero-image" src="../assets/case-studies/placepath/placepath-dashboard-desktop.webp" alt="Desktop PlacePath coordinator dashboard" decoding="async">\n  </figure>\n            <p class="project-subtitle">Turning complex requirements across learning providers, employers and students into a focused MVP and connected, role-based workflow.</p>\n            <p class="project-intro">As the independent Product Design Consultant, I led phase one from product definition and service mapping through prototyping, responsive UI and developer handoff.</p>'''
          new='''            <p class="project-subtitle">Turning complex requirements across learning providers, employers and students into a focused MVP and connected, role-based workflow.</p>\n            <p class="project-intro">As the independent Product Design Consultant, I led phase one from product definition and service mapping through prototyping, responsive UI and developer handoff.</p>\n            <figure class="hero-visual placepath-hero-visual placepath-responsive-showcase placepath-desktop-only-hero" aria-label="PlacePath coordinator dashboard desktop view">\n              <div class="placepath-desktop-hero-frame">\n                <img class="placepath-desktop-hero-image" src="../assets/case-studies/placepath/placepath-dashboard-desktop.webp" alt="Desktop PlacePath coordinator dashboard" decoding="async">\n              </div>\n            </figure>'''
          if old not in s: raise SystemExit('hero block not found')
          s=s.replace(old,new,1)
          marker='''    .placepath-desktop-hero-image {\n      display: block;\n      width: 100%;\n      height: auto;\n      margin: 0 auto;\n      border: 1px solid #e2e8f0;\n      background: #fff;\n    }'''
          replacement='''    .placepath-desktop-only-hero {\n      max-width: 1100px !important;\n      margin: clamp(28px, 4vw, 48px) auto 0 !important;\n      padding: 0 !important;\n    }\n\n    .placepath-desktop-hero-frame {\n      padding: clamp(12px, 1.5vw, 18px);\n      border: 1px solid #e2e8f0;\n      border-radius: 14px;\n      background: #f8fafc;\n      box-shadow: 0 18px 48px rgba(15, 23, 42, .10);\n    }\n\n    .placepath-desktop-hero-image {\n      display: block;\n      width: 100%;\n      height: auto;\n      margin: 0 auto;\n      border: 1px solid #e2e8f0;\n      border-radius: 8px;\n      background: #fff;\n    }\n\n    body.dark-mode .placepath-desktop-hero-frame {\n      border-color: #475569;\n      background: #1e293b;\n      box-shadow: none;\n    }'''
          if marker not in s: raise SystemExit('image CSS not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
          rm .github/workflows/placepath-hero-layout-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/placepath-case-study.html .github/workflows/placepath-hero-layout-once.yml
          git commit -m "Refine PlacePath hero presentation"
          git push