name: Remove duplicate PlacePath step 3 images
on: push
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Remove duplicate PlacePath step 3 images'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy image grid after the three steps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/site-header-base.js')
          s=p.read_text()
          old='''          const evolutionGrid = evolutionSection.querySelector('.placepath-evolution');\n          if (evolutionGrid) evolutionGrid.before(evidence);\n          else evolutionSection.append(evidence);'''
          new='''          const evolutionGrid = evolutionSection.querySelector('.placepath-evolution');\n          if (evolutionGrid) {\n            evolutionGrid.before(evidence);\n            evolutionGrid.remove();\n          } else {\n            evolutionSection.append(evidence);\n          }'''
          if old not in s: raise SystemExit('evolution insertion block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/remove-placepath-legacy-step3-images-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/site-header-base.js .github/workflows/remove-placepath-legacy-step3-images-once.yml
          git commit -m "Remove duplicate PlacePath step 3 image grid"
          git push