name: PlacePath desktop image one-off

on:
  push:
    paths:
      - '.github/workflows/placepath-desktop-once.yml'

permissions:
  contents: write

jobs:
  update-placepath-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace only the desktop hero image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          html_path = Path('work/placepath-case-study.html')
          source_path = Path('assets/case-studies/placepath/placepath-dashboard-desktop.b64.txt')

          b64 = ''.join(source_path.read_text().split())
          raw = base64.b64decode(b64, validate=True)
          if not raw.startswith(b'RIFF') or raw[8:12] != b'WEBP':
              raise SystemExit('Desktop source is not a valid WebP payload')

          html = html_path.read_text()
          pattern = re.compile(
              r'(<div class="placepath-device placepath-device--desktop">\s*\n\s*)'
              r'<img src="data:image/webp;base64,[^"]+" alt="Desktop PlacePath coordinator dashboard" decoding="async">'
          )
          replacement = (
              r'\1<img src="data:image/webp;base64,' + b64 +
              '" alt="Desktop PlacePath coordinator dashboard" decoding="async">'
          )
          updated, count = pattern.subn(replacement, html, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace one desktop image, replaced {count}')

          updated, ratio_count = re.subn(
              r'(\.placepath-device--desktop\s*\{[^}]*?aspect-ratio:\s*)2047\s*/\s*1151(\s*;)',
              r'\g<1>1000 / 624\2',
              updated,
              count=1,
              flags=re.S,
          )
          if ratio_count != 1:
              raise SystemExit(f'Expected to update one desktop aspect ratio, updated {ratio_count}')

          html_path.write_text(updated)
          PY
      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          rm .github/workflows/placepath-desktop-once.yml
          git config user.name 'Sophie Purewal'
          git config user.email '117828027+SophiePurewal@users.noreply.github.com'
          git add work/placepath-case-study.html .github/workflows/placepath-desktop-once.yml
          git commit -m 'Update PlacePath desktop hero image'
          git push
