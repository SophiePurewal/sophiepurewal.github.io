name: Use PlacePath user stories image and remove scope frame
on: push
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Use PlacePath user stories image and remove scope frame'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update scope image and styling only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/site-header-base.js')
          s=p.read_text()
          s=s.replace('''            margin: 32px 0 28px;\n            padding: clamp(24px, 3vw, 36px);\n            border: 1px solid var(--line);\n            border-radius: 14px;\n            background: #f8fafc;''','''            margin: 32px 0 28px;\n            padding: 0;\n            border: 0;\n            border-radius: 0;\n            background: transparent;''',1)
          s=s.replace('''          body.dark-mode .placepath-evidence {\n            background: #1e293b;\n          }''','''          body.dark-mode .placepath-evidence {\n            background: transparent;\n          }''',1)
          s=s.replace('''<img src="${assetBase}placepath-user-stories-collate-collect.webp" alt="Excerpt from the PlacePath requirements showing user stories for collating student information and collecting employer information" loading="lazy" decoding="async">''','''<img src="../Placepath_UserStories.png" alt="PlacePath user stories showing the requirements used to define the first release" loading="lazy" decoding="async">''',1)
          p.write_text(s)
          PY
          rm .github/workflows/placepath-scope-image-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/site-header-base.js .github/workflows/placepath-scope-image-cleanup-once.yml
          git commit -m "Use PlacePath user stories image and remove scope frame"
          git push