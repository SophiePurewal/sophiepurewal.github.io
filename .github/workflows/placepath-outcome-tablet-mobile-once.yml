name: Use tablet and mobile images in PlacePath outcome
on: push
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Use tablet and mobile images in PlacePath outcome'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace outcome desktop image with tablet and mobile images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/placepath-case-study.html')
          s=p.read_text()
          old='''            <figure class="hero-visual placepath-hero-visual placepath-responsive-showcase placepath-desktop-only-hero" aria-label="PlacePath coordinator dashboard desktop view">\n              <div class="placepath-desktop-hero-frame">\n                <img class="placepath-desktop-hero-image" src="../Placepath_Desktop.png" alt="Desktop PlacePath coordinator dashboard" decoding="async">\n              </div>\n            </figure>'''
          new='''            <figure class="hero-visual placepath-hero-visual placepath-responsive-showcase placepath-outcome-device-pair" aria-label="PlacePath tablet and mobile product views">\n              <div class="placepath-outcome-device-pair__item">\n                <img src="../Placepath_Tablet.png" alt="PlacePath tablet interface" decoding="async">\n              </div>\n              <div class="placepath-outcome-device-pair__item placepath-outcome-device-pair__item--mobile">\n                <img src="../Placepath_Mobile.png" alt="PlacePath mobile interface" decoding="async">\n              </div>\n            </figure>'''
          if old not in s: raise SystemExit('outcome desktop image block not found')
          s=s.replace(old,new,1)
          css='''\n    .placepath-outcome-device-pair {\n      display: grid !important;\n      grid-template-columns: minmax(0, 1.35fr) minmax(220px, .65fr) !important;\n      gap: clamp(24px, 4vw, 48px) !important;\n      align-items: start !important;\n      width: 100% !important;\n      max-width: 1100px !important;\n      margin: clamp(32px, 4vw, 52px) auto 0 !important;\n      padding: 0 !important;\n      background: transparent !important;\n      border: 0 !important;\n      box-shadow: none !important;\n    }\n\n    .placepath-outcome-device-pair__item {\n      min-width: 0;\n    }\n\n    .placepath-outcome-device-pair__item img {\n      display: block;\n      width: 100%;\n      height: auto;\n      border: 0;\n      background: transparent;\n    }\n\n    .placepath-outcome-device-pair__item--mobile {\n      max-width: 360px;\n      justify-self: center;\n    }\n\n    @media (max-width: 700px) {\n      .placepath-outcome-device-pair {\n        grid-template-columns: 1fr !important;\n      }\n\n      .placepath-outcome-device-pair__item--mobile {\n        max-width: 280px;\n      }\n    }\n'''
          s=s.replace('</style>', css+'\n</style>',1)
          p.write_text(s)
          PY
          rm .github/workflows/placepath-outcome-tablet-mobile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/placepath-case-study.html .github/workflows/placepath-outcome-tablet-mobile-once.yml
          git commit -m "Show PlacePath tablet and mobile outcome images"
          git push