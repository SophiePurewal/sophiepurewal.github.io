name: Fix PlacePath image once
on: push
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Run PlacePath image path fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/placepath-case-study.html')
          s=p.read_text()
          old='../assets/case-studies/placepath/placepath-dashboard-desktop.webp'
          new='../assets/case-studies/placepath/final-dashboard.png'
          if old not in s: raise SystemExit('old hero path not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          test -f assets/case-studies/placepath/final-dashboard.png
          rm .github/workflows/fix-placepath-image-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/placepath-case-study.html .github/workflows/fix-placepath-image-once.yml
          git commit -m "Fix PlacePath hero image source"
          git push