name: Match PlacePath hero copy size
on: push
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Match PlacePath hero copy size'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match only hero paragraph sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/placepath-case-study.html')
          s=p.read_text()
          marker='''    .placepath-hero .project-subtitle,\n    .placepath-hero .project-intro {\n      width: 100%;\n      max-width: 46.75rem;\n    }'''
          replacement='''    .placepath-hero .project-subtitle,\n    .placepath-hero .project-intro {\n      width: 100%;\n      max-width: 46.75rem;\n      font-size: 1rem !important;\n      line-height: 1.7 !important;\n    }'''
          if marker not in s: raise SystemExit('hero copy CSS not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
          rm .github/workflows/placepath-hero-copy-size-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/placepath-case-study.html .github/workflows/placepath-hero-copy-size-once.yml
          git commit -m "Match PlacePath hero copy to body size"
          git push