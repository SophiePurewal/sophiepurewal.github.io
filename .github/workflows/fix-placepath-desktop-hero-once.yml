name: Fix PlacePath desktop hero once

on:
  push:
    paths:
      - '.github/workflows/fix-placepath-desktop-hero-once.yml'

permissions:
  contents: write

jobs:
  fix-placepath-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore desktop image and simplify hero
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          html_path = Path('work/placepath-case-study.html')
          source_path = Path('assets/case-studies/placepath/placepath-dashboard-desktop.b64.txt')
          image_path = Path('assets/case-studies/placepath/placepath-dashboard-desktop.webp')

          b64 = ''.join(source_path.read_text().split())
          raw = base64.b64decode(b64, validate=True)
          if not raw.startswith(b'RIFF') or raw[8:12] != b'WEBP':
              raise SystemExit('Desktop source is not a valid WebP')
          image_path.write_bytes(raw)

          html = html_path.read_text()
          replacement = '''<figure class="hero-visual placepath-hero-visual placepath-responsive-showcase placepath-desktop-only-hero" aria-label="PlacePath coordinator dashboard desktop view">
              <img class="placepath-desktop-hero-image" src="../assets/case-studies/placepath/placepath-dashboard-desktop.webp" alt="Desktop PlacePath coordinator dashboard" decoding="async">
            </figure>'''

          updated, count = re.subn(
              r'<figure class="hero-visual placepath-hero-visual placepath-responsive-showcase"[^>]*>.*?</figure>',
              replacement,
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one hero figure replacement, got {count}')

          css = '''\n    /* Desktop-only PlacePath hero */\n    .placepath-desktop-only-hero {\n      display: block !important;\n      width: 100% !important;\n      max-width: var(--section-shell-max, 1180px) !important;\n      min-height: 0 !important;\n      margin: 0 auto !important;\n      padding: clamp(18px, 3vw, 36px) 0 clamp(30px, 5vw, 64px) !important;\n      overflow: visible !important;\n      background: transparent !important;\n      border: 0 !important;\n      box-shadow: none !important;\n    }\n\n    .placepath-desktop-hero-image {\n      display: block;\n      width: 100%;\n      height: auto;\n      margin: 0 auto;\n      border: 1px solid #e2e8f0;\n      background: #fff;\n    }\n'''

          if '/* Desktop-only PlacePath hero */' not in updated:
              updated = updated.replace('</style>', css + '\n</style>', 1)

          html_path.write_text(updated)
          PY

      - name: Commit fix and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/fix-placepath-desktop-hero-once.yml
          git config user.name 'Sophie Purewal'
          git config user.email '117828027+SophiePurewal@users.noreply.github.com'
          git add work/placepath-case-study.html assets/case-studies/placepath/placepath-dashboard-desktop.webp .github/workflows/fix-placepath-desktop-hero-once.yml
          git commit -m 'Fix PlacePath desktop-only hero image'
          git push
