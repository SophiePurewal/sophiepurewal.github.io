name: Correct PlacePath device image placement
on: push
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Correct PlacePath device image placement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put desktop at start and tablet mobile in outcome only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/placepath-case-study.html')
          s=p.read_text()

          # Replace ONLY the hero tablet/mobile pair with the desktop image.
          hero_start=s.index('<figure class="hero-visual placepath-hero-visual placepath-responsive-showcase placepath-outcome-device-pair"')
          hero_end=s.index('</figure>', hero_start)+len('</figure>')
          hero='''<figure class="hero-visual placepath-hero-visual placepath-desktop-only-hero" aria-label="PlacePath desktop product view">\n              <div class="placepath-desktop-hero-frame">\n                <img class="placepath-desktop-hero-image" src="../Placepath_Desktop.png" alt="PlacePath desktop interface" decoding="async">\n              </div>\n            </figure>'''
          s=s[:hero_start]+hero+s[hero_end:]

          # Replace ONLY the Outcome/Deliver desktop dashboard figure with tablet + mobile.
          delivery=s.index('aria-labelledby="delivery-title"')
          fig_start=s.index('<figure class="placepath-delivery-visual">', delivery)
          fig_end=s.index('</figure>', fig_start)+len('</figure>')
          outcome='''<figure class="placepath-outcome-device-pair placepath-outcome-showcase" aria-label="PlacePath responsive tablet and mobile product views">\n            <div class="placepath-outcome-device-pair__item">\n              <img src="../Placepath_Tablet.png" alt="PlacePath tablet interface" loading="lazy" decoding="async">\n            </div>\n            <div class="placepath-outcome-device-pair__item placepath-outcome-device-pair__item--mobile">\n              <img src="../Placepath_Mobile.png" alt="PlacePath mobile interface" loading="lazy" decoding="async">\n            </div>\n          </figure>'''
          s=s[:fig_start]+outcome+s[fig_end:]

          # Scope restrained showcase treatment ONLY to these hero/outcome images.
          css='''\n    /* Restrained showcase treatment: hero desktop and final outcome devices only */\n    .placepath-desktop-only-hero,\n    .placepath-outcome-showcase {\n      width: 100%;\n      max-width: 1100px;\n      margin: clamp(32px, 4vw, 52px) auto;\n      padding: clamp(14px, 2vw, 24px);\n      border: 1px solid #e2e8f0;\n      border-radius: 14px;\n      background: #f8fafc;\n      box-shadow: 0 14px 38px rgba(15, 23, 42, .07);\n    }\n    .placepath-desktop-hero-frame { padding: 0; border: 0; background: transparent; box-shadow: none; }\n    .placepath-desktop-hero-image { display:block; width:100%; height:auto; border:0; border-radius:7px; background:#fff; }\n    .placepath-outcome-showcase {\n      display:grid;\n      grid-template-columns:minmax(0, 1.55fr) minmax(180px, .55fr);\n      gap:clamp(20px, 3vw, 38px);\n      align-items:start;\n      justify-items:center;\n    }\n    .placepath-outcome-showcase .placepath-outcome-device-pair__item img { display:block; width:100%; height:auto; border:0; background:#fff; }\n    .placepath-outcome-showcase .placepath-outcome-device-pair__item--mobile { width:100%; max-width:330px; }\n    body.dark-mode .placepath-desktop-only-hero, body.dark-mode .placepath-outcome-showcase { background:#1e293b; border-color:#475569; box-shadow:none; }\n    @media (max-width:700px) { .placepath-outcome-showcase { grid-template-columns:1fr; } .placepath-outcome-showcase .placepath-outcome-device-pair__item--mobile { max-width:280px; } }\n'''
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
          rm .github/workflows/placepath-correct-device-placement-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/placepath-case-study.html .github/workflows/placepath-correct-device-placement-once.yml
          git commit -m "Place PlacePath device images in correct sections"
          git push